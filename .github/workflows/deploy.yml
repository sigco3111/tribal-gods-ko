# Build the Vite game and publish it to GitHub Pages on every push to main.
# The site ends up at https://br3nt.github.io/tribal-gods/ (base is set in
# vite.config.ts to match). Pages source must be "GitHub Actions" in the
# repo settings — set once via `gh api`, see the repo README/commit notes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you redeploy by hand from the Actions tab

# Least-privilege tokens the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build # tsc --noEmit && vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
# 한글화 저장소(sigco3111/tribal-gods-ko): 사이트 경로는 vite.config.ts의 base(/tribal-gods-ko/)와 맞춥니다.
